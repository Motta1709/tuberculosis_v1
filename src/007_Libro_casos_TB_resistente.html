<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>007 Libro de registro de casos de TB resistente</title>
</head>
<body>
    <h1>007 Libro de registro de casos de TB resistente</h1>
    <form action="#" method="post">
        <label for="numero_caso">Número de caso:</label>
        <input type="text" id="numero_caso" name="numero_caso" required><br><br>
        
        <label for="fecha_diagnostico">Fecha de diagnóstico:</label>
        <input type="date" id="fecha_diagnostico" name="fecha_diagnostico" required><br><br>
        
        <label for="nombre">Nombre del paciente:</label>
        <input type="text" id="nombre" name="nombre" required><br><br>
        
        <label for="edad">Edad:</label>
        <input type="number" id="edad" name="edad" min="0" required><br><br>
        
        <label for="sexo">Sexo:</label>
        <select id="sexo" name="sexo" required>
            <option value="">Seleccionar</option>
            <option value="M">Masculino</option>
            <option value="F">Femenino</option>
        </select><br><br>
        
        <label for="direccion">Dirección:</label>
        <input type="text" id="direccion" name="direccion"><br><br>
        
        <label for="tipo_resistencia">Tipo de resistencia:</label>
        <select id="tipo_resistencia" name="tipo_resistencia" required>
            <option value="">Seleccionar</option>
            <option value="MDR">MDR-TB</option>
            <option value="XDR">XDR-TB</option>
            <option value="RR">RR-TB</option>
        </select><br><br>
        
        <fieldset>
            <legend>Resistencia a fármacos:</legend>
            <input type="checkbox" id="rifampicina" name="resistente" value="rifampicina">
            <label for="rifampicina">Rifampicina</label><br>
            <input type="checkbox" id="isoniazida" name="resistente" value="isoniazida">
            <label for="isoniazida">Isoniazida</label><br>
            <input type="checkbox" id="etambutol" name="resistente" value="etambutol">
            <label for="etambutol">Etambutol</label><br>
            <input type="checkbox" id="estreptomicina" name="resistente" value="estreptomicina">
            <label for="estreptomicina">Estreptomicina</label><br>
            <input type="checkbox" id="fluoroquinolonas" name="resistente" value="fluoroquinolonas">
            <label for="fluoroquinolonas">Fluoroquinolonas</label><br>
            <input type="checkbox" id="aminoglucosidos" name="resistente" value="aminoglucosidos">
            <label for="aminoglucosidos">Aminoglucósidos</label><br>
        </fieldset><br>
        
        <label for="regimen">Régimen de tratamiento:</label>
        <input type="text" id="regimen" name="regimen" placeholder="Ej: Regimen MDR"><br><br>
        
        <label for="fecha_inicio">Fecha de inicio de tratamiento:</label>
        <input type="date" id="fecha_inicio" name="fecha_inicio"><br><br>
        
        <label for="resultado">Resultado del tratamiento:</label>
        <select id="resultado" name="resultado">
            <option value="">Seleccionar</option>
            <option value="curado">Curado</option>
            <option value="completado">Tratamiento completado</option>
            <option value="fracaso">Fracaso</option>
            <option value="muerte">Muerte</option>
            <option value="perdido">Perdido</option>
            <option value="otro">Otro</option>
        </select><br><br>
        
        <label for="observaciones">Observaciones:</label>
        <textarea id="observaciones" name="observaciones"></textarea><br><br>
        
        <input type="submit" value="Guardar Caso">
    </form>
</body>
</html>
